[project]
name = "real-time-blockchain-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.14.2",
    "duckdb>=1.5.4",
    "pandas>=3.0.4",
    "pyspark==4.0.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.20",
    "snowflake-connector-python>=4.8.0",
    "streamlit>=1.58.0",
    "web3>=7.16.0",
    "websocket-client>=1.9.0",
]

[dependency-groups]
dev = [
    "dbt-core>=1.12.5",
    "dbt-snowflake>=1.12.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
