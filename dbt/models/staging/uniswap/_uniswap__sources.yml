version: 2

sources:
  - name: blockchain_raw
    description: Canonical blockchain and reference datasets loaded from S3 Parquet into Snowflake RAW.
    database: BLOCKCHAIN_ANALYTICS
    schema: RAW
    tables:
      - name: uniswap_swaps
        identifier: UNISWAP_SWAPS
        description: One canonical RAW record for each ingested Uniswap V3 swap event.
      - name: uniswap_v3_pools
        identifier: UNISWAP_V3_POOLS
        description: One canonical RAW record per official Uniswap V3 pool.
      - name: tokens
        identifier: TOKENS
        description: One canonical ERC-20 metadata record per chain and address.
      - name: aave_borrows
        identifier: AAVE_BORROWS
        description: One canonical RAW record for each Aave V3 Borrow event.
      - name: aave_repays
        identifier: AAVE_REPAYS
        description: One canonical RAW record for each Aave V3 Repay event.
      - name: aave_liquidations
        identifier: AAVE_LIQUIDATIONS
        description: One canonical RAW record for each Aave V3 LiquidationCall event.
      - name: chainlink_prices
        identifier: CHAINLINK_PRICES
        description: One canonical RAW record for each Chainlink market-price observation.
