        data_tests: [not_null, unique]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: chain_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_chain'), field: chain_key}
      - name: protocol_key
        data_tests:
          - not_null
