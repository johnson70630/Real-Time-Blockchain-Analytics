name: blockchain-pilot

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: us-west-2
    awslogs-group: /blockchain/runtime/containers
    awslogs-create-group: "false"
    tag: "pilot/{{.Name}}/{{.ID}}"
    mode: non-blocking
    max-buffer-size: 4m

x-ulimits: &ulimits
  core:
    soft: 0
    hard: 0

x-application: &application
  platform: linux/amd64
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  ulimits: *ulimits
  restart: "no"
  logging: *logging
  tmpfs:
    - /tmp:size=2g,mode=1777
  environment: &environment
    STORAGE_MODE: s3
    DATA_LAKE_BUCKET: johnson-blockchain-analytics-prod
    DATA_LAKE_PREFIX: blockchain-analytics/pilot/runtime/11-6c-v1
    AWS_REGION: us-west-2
    AWS_DEFAULT_REGION: us-west-2
    AWS_EC2_METADATA_DISABLED: "false"
    NO_PROXY: 169.254.169.254,localhost,127.0.0.1,kafka
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC: pilot_uniswap_v3_events
    ENABLED_PROTOCOLS: uniswap_v3
    PROTOCOL: uniswap_v3
    CHAIN: arbitrum

services:
  kafka:
    image: ${KAFKA_IMAGE:?reviewed ECR digest required}
    platform: linux/amd64
    user: "1000:1000"
    init: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits: *ulimits
    mem_limit: 3g
    cpus: 1.0
    stop_grace_period: 90s
    logging: *logging
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?persistent cluster ID required}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 21474836480
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - type: bind
        source: /var/lib/blockchain-runtime/kafka/data
        target: /var/lib/kafka/data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  topic-init:
    image: ${KAFKA_IMAGE:?reviewed ECR digest required}
    platform: linux/amd64
    user: "1000:1000"
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits: *ulimits
    logging: *logging
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, "kafka:9092", --create, --if-not-exists, --topic, pilot_uniswap_v3_events, --partitions, "1", --replication-factor, "1", --config, retention.ms=259200000, --config, retention.bytes=21474836480]

  spark:
    <<: *application
    image: ${SPARK_IMAGE:?reviewed ECR digest required}
    mem_limit: 7g
    cpus: 2.0
    stop_grace_period: 180s
    # Snappy loads its verified native library from java.io.tmpdir.
    tmpfs:
      - /tmp:size=2g,mode=1777,exec
    environment:
      <<: *environment
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_SUBMIT_ARGS: --driver-memory 3g pyspark-shell
    volumes:
      - type: bind
        source: /run/blockchain-runtime/pilot
        target: /run/pilot
        bind:
          create_host_path: false
    depends_on:
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "from runtime.stream import healthy; raise SystemExit(0 if healthy() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

  producer:
    <<: *application
    image: ${PRODUCER_IMAGE:?reviewed ECR digest required}
    mem_limit: 1g
    cpus: 0.5
    stop_grace_period: 75s
    secrets: [alchemy_websocket_url]
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully

secrets:
  alchemy_websocket_url:
    file: /run/blockchain-runtime/secrets/alchemy_websocket_url
