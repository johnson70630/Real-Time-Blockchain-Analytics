# Local synthetic integration only. No Alchemy, AWS endpoints, or credentials.
name: blockchain-pilot-offline
services:
  kafka:
    image: blockchain-pilot-kafka:offline
    platform: linux/amd64
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,TEST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,TEST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,TEST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes: ["test-kafka:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
  spark-test:
    image: blockchain-pilot-spark:offline
    platform: linux/amd64
    init: true
    user: "0:0"
    read_only: true
    tmpfs: ["/tmp:size=2g,mode=1777,exec"]
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONPATH: /app
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - test-spark:/test-data
      - ../../tests/integration/streaming_pilot.py:/test.py:ro
    entrypoint: [python, /test.py]
    depends_on:
      kafka:
        condition: service_healthy
  inspection-disk-test:
    image: blockchain-pilot-spark:offline
    platform: linux/amd64
    init: true
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    mem_limit: 256m
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: /app
    volumes:
      - test-kafka:/kafka:ro
      - test-spark:/test-data:ro
      - ../../tests/integration/inspection_disk.py:/test.py:ro
    entrypoint: [python, /test.py]
volumes:
  test-kafka:
  test-spark:
networks:
  default:
    internal: true
