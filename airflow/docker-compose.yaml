name: blockchain-analytics-airflow

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: ${AIRFLOW_IMAGE_NAME:-blockchain-analytics-airflow:3.1.8}
  environment:
    AIRFLOW__API__SECRET_KEY_CMD: cat /opt/airflow/config/runtime_secret
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /opt/airflow/config/runtime_secret
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow@postgres/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AAVE_V3_POOL_ADDRESS: ${AAVE_V3_POOL_ADDRESS:-0x794a61358D6845594F94dc1DB02A252b5b4814aD}
    DBT_PROFILES_DIR: /home/airflow/.dbt
    PROJECT_PYTHON: /opt/project-venv/bin/python
    PROJECT_ROOT: /opt/project
    PYTHONPATH: /opt/project
    SNOWFLAKE_CONNECTION_NAME: ${SNOWFLAKE_CONNECTION_NAME:-blockchain-dev}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-BLOCKCHAIN_TRANSFORM_WH}
    SPARK_LOCAL_IP: 127.0.0.1
    WAREHOUSE_PYTHON: /opt/warehouse-venv/bin/python
  env_file:
    - path: ../.env
      required: false
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./tests:/opt/airflow/tests:ro
    - ../config:/opt/project/config:ro
    - ../backfill:/opt/project/backfill:ro
    - ../market_data:/opt/project/market_data:ro
    - ../producer:/opt/project/producer:ro
    - ../reference_data:/opt/project/reference_data:ro
    - ../spark:/opt/project/spark:ro
    - ../warehouse:/opt/project/warehouse:ro
    - ../orchestration:/opt/project/orchestration:ro
    - ../dbt:/opt/project/dbt:ro
    - ${HOME}/.aws:/home/airflow/.aws:ro
    - ${HOME}/.dbt:/home/airflow/.dbt:ro
    - ${HOME}/.snowflake:/home/airflow/.snowflake:ro
    # Preserve absolute private-key paths already used by the local dbt profile.
    - ${HOME}/.snowflake:${HOME}/.snowflake:ro
    - airflow-config:/opt/airflow/config
    - airflow-ivy:/home/airflow/.ivy2.5.2
    - airflow-dbt-logs:/opt/project/dbt/logs
    - airflow-dbt-target:/opt/project/dbt/target
    - airflow-logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - airflow-postgres:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        if [ ! -s /opt/airflow/config/runtime_secret ]; then
          python -c "import secrets; print(secrets.token_urlsafe(48))" > /opt/airflow/config/runtime_secret
          chmod 600 /opt/airflow/config/runtime_secret
        fi
        chown -R 50000:0 \
          /opt/airflow/config \
          /opt/airflow/logs \
          /home/airflow/.ivy2.5.2 \
          /opt/project/dbt/logs \
          /opt/project/dbt/target
        runuser -u airflow -- airflow db migrate
        runuser -u airflow -- airflow pools set warehouse_writes 4 \
          "Serializes exclusive warehouse and S3 backfill writes"
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    profiles: ["debug"]
    entrypoint: airflow
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-config:
  airflow-ivy:
  airflow-dbt-logs:
  airflow-dbt-target:
  airflow-logs:
  airflow-postgres:
